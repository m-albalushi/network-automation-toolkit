- name: Backup and collect switch info # top lvl name of paly
  hosts: switches #  run this paly against list of devcies under name of switches
  gather_facts: no # skip auto info gathering from devcies these are Cisco not Linux

  tasks:
    - name: Backup running config # name of task 1
      cisco.ios.ios_config: # use ansible module called ios_config under cisco main module of ansible to take device config
        backup: true # tell ansible to take the back
        backup_options: # additional settings for backup
          dir_path: ./backups # save backup in folder called backup
          filename: "{{ inventory_hostname }}.cfg" # inventory_hostname is an ansible varibel that contains the names of  device in inventory , and save the save the file with hostname liek SW1.cfg

    - name: Gather hardware facts # task 2 collect device info
      cisco.ios.ios_facts: # module  that collect info
        gather_subset: hardware #collect only hardware info


    - name: Run show commands # task 3 run the commands
      cisco.ios.ios_command: #modleu for commands
        commands:
          - show version
          - show inventory
          - show interfaces status
          - show vlan brief
          - show cdp neighbors
      register: out # save all commands output in a variabel called out

    # Not every switch is a stack, so don't stop if this one fails
    - name: Check if it is a stack # task 4 sepraet task for stack checking
      cisco.ios.ios_command:
        commands:
          - show switch
      register: stack # save the output of show switch in a variabel called stack
      failed_when: no  #even if command fails donot stop , and continuse with next task

    # Files are saved on Ubuntu, not on the switch
    - name: Create info folder # task 5 create a folder
      file: # general purpose modlue manages files and folders  / you need to specify  where to store them by   delegate_to:
        path: ./info # folder we want
        state: directory  #make sure its a folder
      delegate_to: localhost  #create it in ubuntu not switch
      run_once: true # do it one time , not once per switch

    - name: Save everything to a text file #task 6 save hardware info in a file
      copy: # general purpose module that writes in a file
        content: "{{ (out.stdout + (stack.stdout | default([]))) | join('\n\n==========\n\n') }}" #  the fiel contains info store in 2 varibles out and stack , also seperate them with seperator ========
        dest: "./info/{{ inventory_hostname }}.txt" # and save the file as switch name per each switch
      delegate_to: localhost # save them in server not switch

